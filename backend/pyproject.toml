[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-wind-eval-backend"
version = "0.1.0"
description = "FastAPI backend for UK day-ahead wind generation forecast evaluation"
authors = [{ name = "Senior Full-Stack Engineer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.11",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.8.1",
    "httpx==0.28.1",
    "pandas==2.2.3",
    "numpy==2.2.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "black==25.1.0",
    "ruff==0.9.10",
    "mypy==1.15.0",
    "pandas-stubs==2.2.3.241126",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort imports
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # unused arguments
]
ignore = ["E501"] # Handled by formatter

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
