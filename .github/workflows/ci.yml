name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run code formatting & linter checks
        run: |
          black --check backend/
          ruff check backend/

      - name: Run Pytest test suite with coverage
        run: |
          python -m pytest backend/tests -v --cov=backend/app --cov-report=term-missing --cov-fail-under=85

  frontend-test:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc -b

      - name: Run Vitest unit tests
        run: npm test

      - name: Run production build bundle
        run: npm run build
